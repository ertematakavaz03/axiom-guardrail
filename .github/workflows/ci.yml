name: Axiom Guardrail CI

on:
  pull_request:
  push:
    branches: [main, master, phase4/runtime-enforcement-ci]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy apps services packages demos
      - run: pytest tests/unit tests/golden tests/benchmarks -q

  security:
    name: Deterministic security enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      # The runtime enforcement layer, its abuse coverage, and the mandatory audit that
      # proves enforcement cannot see how it is scored. Named explicitly so a failure
      # here is unmistakable in the checks list.
      - name: Runtime enforcement and policy abuse suite
        run: >-
          pytest
          tests/unit/test_runtime_enforcement.py
          tests/unit/test_runtime_egress.py
          tests/unit/test_mediated_agent.py
          tests/unit/test_security_core.py
          tests/unit/test_security_hardening.py
          tests/unit/test_tool_gateway.py
          tests/unit/test_trace_detector.py
          -q
      - name: Anti-overfitting audit
        run: pytest tests/unit/test_runtime_antioverfit.py -q
      - name: Release gate
        run: pytest tests/unit/test_release_gate.py -q
      # A grep-level backstop for the audit above: production enforcement source must
      # not contain a benchmark identifier even in a comment.
      - name: No benchmark identifiers in runtime enforcement source
        run: |
          if grep -rnE '\brs[ab]-[0-9]{3}\b' services/security/runtime.py services/security/egress.py demos/mediated_agent/; then
            echo "benchmark scenario id found in runtime enforcement source"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentarena_test
          POSTGRES_USER: agentarena
          POSTGRES_PASSWORD: agentarena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentarena -d agentarena_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports: ["6333:6333"]
    env:
      AGENTARENA_DATABASE_URL: postgresql+asyncpg://agentarena:agentarena@localhost:5432/agentarena_test
      AGENTARENA_REDIS_URL: redis://localhost:6379/0
      AGENTARENA_QDRANT_URL: http://localhost:6333
      AGENTARENA_QDRANT_COLLECTION_PREFIX: agentarena_test
      AGENTARENA_JWT_SECRET: integration-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest tests/integration -q -m integration
