name: Phase 1 CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy apps services packages demos
      - run: pytest tests/unit tests/golden -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentarena_test
          POSTGRES_USER: agentarena
          POSTGRES_PASSWORD: agentarena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentarena -d agentarena_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AGENTARENA_DATABASE_URL: postgresql+asyncpg://agentarena:agentarena@localhost:5432/agentarena_test
      AGENTARENA_REDIS_URL: redis://localhost:6379/0
      AGENTARENA_JWT_SECRET: integration-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest tests/integration -q -m integration

