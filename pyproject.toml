[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarena"
version = "0.1.0"
description = "AgentArena Phase 1 - evidence-backed AI agent quality and security evaluation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.1.10,<1.2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "asgi-lifespan>=2.1,<3",
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
langfuse = ["langfuse>=3,<4"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "services", "packages", "demos"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis"]
